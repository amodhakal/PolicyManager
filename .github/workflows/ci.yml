name: CI

on:
  push:
    branches: [main]
  # No branch filter on pull_request. This workflow is developed as a stack of dependent pull
  # requests, where only the bottom one targets main, so filtering on the base branch would leave
  # every PR above it permanently unchecked. GitHub already skips the duplicate run for PR branches.
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          # No packages.lock.json is committed (neither csproj sets
          # RestorePackagesWithLockFile), so setup-dotnet keys the NuGet cache
          # off the project manifests instead. Both are listed explicitly so a
          # future project outside these paths cannot silently miss the key.
          cache-dependency-path: |
            PolicyManager/PolicyManager.csproj
            PolicyManager.Tests/PolicyManager.Tests.csproj

      - name: Restore
        run: dotnet restore

      # Analyzers are enforced narrowly. PolicyManager.csproj sets
      # GenerateDocumentationFile=true and Swashbuckle consumes the XML, so the
      # project still emits real CS1591 (undocumented `public partial class
      # Program` in Program.cs) and CS1573 (IClaimsService/PoliciesService
      # document `id`/`dto` but not `cancellationToken`). Blanket
      # TreatWarningsAsErrors would therefore turn the build red, so only a
      # curated, defect-class list of rules is escalated. These properties are
      # workflow-scoped on purpose; moving them into a csproj is the follow-up.
      - name: Build
        run: |
          dotnet build --no-restore --configuration Release \
            -p:EnableNETAnalyzers=true \
            -p:AnalysisLevel=latest \
            -p:AnalysisMode=Default \
            -p:TreatWarningsAsErrors=false \
            -p:WarningsAsErrors="CS0105%3BCS0108%3BCS0114%3BCS0162%3BCS0164%3BCS8625%3BCA1416"

      - name: Test with coverage
        run: |
          dotnet test --no-build --configuration Release \
            --filter "Category!=SqlServer" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/Migrations/**/*.cs"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/**/coverage.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The unit suite above runs entirely on the EF Core in-memory provider, which enforces no unique
  # indexes, no foreign keys, no column precision and no transactions. These tests start a real SQL
  # Server via Testcontainers and cover exactly the constraints that provider hides. They need Docker,
  # so they run in their own job: a missing or slow container must not be reported as an application
  # failure, and a schema regression must not be masked by the in-memory suite passing.
  sql-server-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            PolicyManager/PolicyManager.csproj
            PolicyManager.Tests/PolicyManager.Tests.csproj

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The first SQL Server image pull is large and the server takes tens of seconds to accept
      # logins, so this job is given room to fail on infrastructure rather than on a timeout.
      - name: Test against real SQL Server
        timeout-minutes: 20
        run: dotnet test --no-build --configuration Release --filter "Category=SqlServer"

  # A model change that ships without a matching migration is invisible to the test suite: the
  # in-memory provider builds its schema from the model, and the SQL Server tests would fail on a
  # missing table rather than on the drift itself. EF surfaces the drift as PendingModelChangesWarning
  # and the CLI exits non-zero, so it is checked directly.
  migration-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 9.*

      - name: Build
        run: dotnet build --configuration Release

      - name: Check for pending model changes
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project PolicyManager/PolicyManager.csproj \
            --no-build

  # No `needs:` on purpose. This job is deliberately independent of
  # build-and-test so a Dockerfile regression surfaces as its own failure, and so
  # a red unit-test suite neither blocks nor masks the image build.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build-only: push and load are both false, so BuildKit discards the
      # result and no registry credentials are involved. The container is never
      # started, so this needs no SQL Server. context/file mirror compose.yaml.
      # No `platforms:` is set because ubuntu-latest is native Linux and
      # DockerDefaultTargetOS=Linux, so the default build platform already
      # matches the Linux base images.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: PolicyManager/Dockerfile
          push: false
          load: false
          tags: policymanager:ci
