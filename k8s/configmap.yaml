apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: policymanager
  labels:
    app.kubernetes.io/name: policymanager
    app.kubernetes.io/part-of: policymanager
data:
  ASPNETCORE_ENVIRONMENT: 'Development'
  # In-cluster DNS names. Do not point at localhost here: each pod has its own loopback.
  DB_HOST: 'mssql'
  DB_NAME: 'PolicyManager'
  DB_USER: 'SA'
  # Outbox broker is on because rabbitmq is part of this stack.
  # Set Broker__Enabled=false to run without a broker (in-process stand-in).
  Broker__Enabled: 'true'
  Broker__Host: 'rabbitmq'
  Broker__Port: '5672'
  Broker__Username: 'guest'
  Broker__Password: 'guest'
  Broker__QueueName: 'policy-manager.outbox'
  # OTel defaults. Override per environment; no collector runs locally by default.
  Telemetry__EnableTracing: 'true'
  Telemetry__EnableMetrics: 'true'
