apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: policymanager
  labels:
    app.kubernetes.io/name: client
    app.kubernetes.io/part-of: policymanager
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client
        app.kubernetes.io/part-of: policymanager
    spec:
      containers:
        - name: client
          # Built via: docker build -f client/Dockerfile -t policymanager-client:local ./client
          # nginx proxies /api/* and /health* to http://api:8080 (the api Service).
          image: policymanager-client:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
