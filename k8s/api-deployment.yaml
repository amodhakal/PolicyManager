apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: policymanager
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: policymanager
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: policymanager
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: policymanager:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: policymanager-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # Liveness = "is this process running". Every registered check.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness = "can this instance serve traffic". Only `ready`-tagged
          # checks (sql-server, message-broker when enabled). This is what
          # keeps a pod out of the Service during SQL boot or broker outage.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # Covers the ~40-90s SQL Server cold start so liveness does not kill
          # a pod that is still waiting on its readiness gate.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sh', '-c', 'sleep 5']
