services:
  api:
    image: policymanager
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
        required: false
    build:
      context: .
      dockerfile: PolicyManager/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-PolicyManager}
      - DB_USER=${DB_USER:-SA}
      - DB_PASSWORD=${DB_PASSWORD}
      # The outbox broker is opt-in. Set BROKER_ENABLED=true in .env to have the API publish
      # outbox messages to RabbitMQ; left unset it keeps the in-process stand-in and never
      # needs the broker to be up.
      - Broker__Enabled=${BROKER_ENABLED:-false}
      - Broker__Host=${BROKER_HOST:-rabbitmq}
      - Broker__Port=${BROKER_PORT:-5672}
      - Broker__Username=${BROKER_USERNAME:-guest}
      - Broker__Password=${BROKER_PASSWORD:-guest}
      - Broker__QueueName=${BROKER_QUEUE_NAME:-policy-manager.outbox}
    ports:
      - "8080:8080"
    networks:
      - mssql-net
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq_container
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${BROKER_USERNAME:-guest}
      - RABBITMQ_DEFAULT_PASS=${BROKER_PASSWORD:-guest}
      - RABBITMQ_DEFAULT_VHOST=${BROKER_VHOST:-/}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - mssql-net
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU12-ubuntu-22.04
    platform: linux/amd64
    container_name: mssql_container
    restart: unless-stopped
    hostname: mssql-server
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Developer
      - MSSQL_BACKUP_DIR=/var/opt/mssql/backups
      - MSSQL_LCID=1033
      - TZ=Etc/UTC
    ports:
      - "14330:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - ./data/mssql/data:/var/opt/mssql/data
      - ./data/mssql/log:/var/opt/mssql/log
      - ./data/mssql/backups:/var/opt/mssql/backups
    networks:
      - mssql-net

networks:
  mssql-net:
    driver: bridge
